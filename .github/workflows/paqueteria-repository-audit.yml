name: Paqueteria repository audit

on:
  push:
    branches: ["main"]
    paths:
      - "paqueteria/**"
      - ".github/patch_*.py"
      - ".github/build_paqueteria_canonical.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "paqueteria/**"
      - ".github/patch_*.py"
      - ".github/build_paqueteria_canonical.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce one official Paqueteria APK pipeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflows = Path('.github/workflows')
          allowed_full_build = workflows / 'release-apk.yml'
          violations = []
          excluded = {
              'build-agent-apk.yml',
              'build-agente-polilla.yml',
              'release-agentes-apk.yml',
              'paqueteria-repository-audit.yml',
          }

          for path in workflows.glob('*.yml'):
              if path == allowed_full_build or path.name in excluded:
                  continue
              text = path.read_text()
              if 'cp -R paqueteria/lib app/lib' in text and 'flutter build apk' in text:
                  violations.append(path.name)

          release = allowed_full_build.read_text()
          required = [
              'build_paqueteria_canonical.py',
              '100000 + GITHUB_RUN_NUMBER',
              'applicationId = "com.angelapps.paqueteria"',
              'PAQUETERIA_KEYSTORE_B64',
              'flutter analyze',
          ]
          for marker in required:
              if marker not in release:
                  violations.append(f'release-apk.yml missing: {marker}')

          canonical = Path('.github/build_paqueteria_canonical.py').read_text()
          feature_markers = [
              'patch_paqueteria_recovery.py',
              'patch_paqueteria_clients_local_first.py',
              'patch_paqueteria_purchases_local_first.py',
              'patch_order_numbers.py',
              'patch_large_backup_restore.py',
              'patch_settings_loading.py',
              'patch_whatsbot_resume_sync.py',
              'patch_whatsbot_manual_sync.py',
              'patch_persistent_search_client_weight.py',
              'patch_multi_gmail_accounts_v2.py',
              'patch_gmail_product_checklists.py',
              'patch_migration_json_merge.py',
              'Fotos obtenidas del correo',
              'GmailAccountsPage',
              'GmailPurchaseLinkService',
              'Vincular con correo usando número de orden',
              'Checklist de artículos del correo',
              'MigrationMergePage',
          ]
          for marker in feature_markers:
              if marker not in canonical:
                  violations.append(f'canonical orchestrator missing: {marker}')

          if violations:
              print('Paqueteria repository policy violations:')
              for item in violations:
                  print(' -', item)
              raise SystemExit(1)

          print('Repository policy passed: one official Paqueteria release path and required feature patches are enforced.')
          PY

      - name: Syntax-check all Paqueteria patch scripts
        run: python3 -m py_compile .github/build_paqueteria_canonical.py .github/patch_*.py

      - name: Setup Flutter for canonical source validation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct canonical source exactly like the release pipeline
        shell: bash
        run: |
          flutter create --platforms=android --org com.angelapps --project-name paqueteria app
          rm -rf app/lib app/test
          cp -R paqueteria/lib app/lib
          cp paqueteria/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          # Analysis only needs the declared asset path to exist. The release
          # workflow generates the real PNG from the canonical SVG.
          touch app/assets/icon.png
          python3 .github/build_paqueteria_canonical.py

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze complete canonical source
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
