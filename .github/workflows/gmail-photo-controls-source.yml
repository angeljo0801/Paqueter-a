name: Apply Gmail photo controls to Paqueteria source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/patch_gmail_photo_controls.py"
      - ".github/workflows/gmail-photo-controls-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Gmail photo controls patch
        run: python3 .github/patch_gmail_photo_controls.py

      - name: Verify patch markers
        shell: bash
        run: |
          grep -q "Buscar tracking en Gmail y reconstruir compra" paqueteria/lib/packages.dart
          grep -q "Toca una imagen para verla en grande" paqueteria/lib/packages.dart
          grep -q "Añadir foto del paquete" paqueteria/lib/packages.dart

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- paqueteria/lib/packages.dart; then
            echo "Source already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paqueteria/lib/packages.dart
          git commit -m "Add Gmail photo viewer, removal and manual photo controls"
          git push origin HEAD:main
