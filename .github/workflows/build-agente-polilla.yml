          s=s.replace("adaptive_icon_background: '#0B65D8'", "adaptive_icon_background: '#101225'")
          p.write_text(s)

          p=Path('agentes/lib/main.dart')
          s=p.read_text()
          s=s.replace("title:'Alas Cargo Agentes'", "title:'Agente Polilla'")
