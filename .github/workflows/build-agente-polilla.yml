name: Build Agente Polilla APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'agentes_bundle/**'
      - 'agentes_overrides/**'
      - 'agentes_icons/polilla.jpg.b64'
      - '.github/workflows/build-agente-polilla.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify persistent signing secrets
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in PAQUETERIA_KEYSTORE_B64 PAQUETERIA_KEYSTORE_PASSWORD PAQUETERIA_KEY_ALIAS PAQUETERIA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Agente Polilla will not publish with temporary signing."
            exit 1
          fi

      - name: Expand source and apply Agente Polilla identity
        shell: bash
        run: |
          mkdir -p agentes
          cat agentes_bundle/part*.txt > /tmp/alas-cargo-agentes-source.b64
          base64 --decode /tmp/alas-cargo-agentes-source.b64 > /tmp/alas-cargo-agentes-source.tar.gz
          tar -xzf /tmp/alas-cargo-agentes-source.tar.gz -C agentes
          cp agentes_overrides/clients.dart agentes/lib/clients.dart
          cp agentes_overrides/orders.dart agentes/lib/orders.dart
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('agentes/lib/main.dart')
          s = main.read_text()
          if "package:flutter_contacts/flutter_contacts.dart" not in s:
              s = s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:flutter_contacts/flutter_contacts.dart';")
          main.write_text(s)

          pub = Path('agentes/pubspec.yaml')
          s = pub.read_text()
          if 'flutter_contacts:' not in s:
              s = s.replace('  shared_preferences: ^2.5.3\n', '  shared_preferences: ^2.5.3\n  flutter_contacts: ^2.5.0\n')
          pub.write_text(s)

          store = Path('agentes/lib/store.dart')
          s = store.read_text()
          replacement = "double orderStoreCost(Map<String, dynamic> e) => number(e['storeCost'] ?? e['storeTotal']);\\nbool orderIsUnassigned(Map<String, dynamic> e) => e['unassigned'] == true || '${e['clientId'] ?? ''}'.trim().isEmpty;\\ndouble orderSavedClientTotal(Map<String, dynamic> e) => number(e['clientTotal']);\\ndouble orderClientTotal(Map<String, dynamic> e) => orderIsUnassigned(e) ? 0.0 : orderSavedClientTotal(e);\\ndouble orderAgentMargin(Map<String, dynamic> e) => orderIsUnassigned(e) ? 0.0 : orderSavedClientTotal(e) - orderStoreCost(e);\\n\\ndouble packageWeight"
          s, count = re.subn(r"double orderStoreCost[\s\S]*?double packageWeight", replacement, s, count=1)
          if count != 1:
              raise SystemExit('No se pudo actualizar la lógica de pedidos sin cliente')
          store.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('agentes/pubspec.yaml')
          s=p.read_text()
          s=s.replace('name: paqueteria_agentes','name: agente_polilla')
          s=s.replace('description: App auxiliar para agentes de Alas Cargo','description: Agente Polilla - duplicado independiente de Alas Cargo Agentes')
          s=re.sub(r'^version:\\s*.*$', 'version: 1.0.1+2', s, flags=re.M)
          s=s.replace("adaptive_icon_background: '#0B65D8'", "adaptive_icon_background: '#101225'")
          p.write_text(s)

          p=Path('agentes/lib/main.dart')
          s=p.read_text()
          s=s.replace("title:'Alas Cargo Agentes'", "title:'Agente Polilla'")
          s=s.replace("Text('Alas Cargo Agentes'", "Text('Agente Polilla'")
          s=s.replace("profileName.isEmpty?'Alas Cargo Agentes'", "profileName.isEmpty?'Agente Polilla'")
          p.write_text(s)

          p=Path('agentes/lib/backup_service.dart')
          s=p.read_text()
          s=s.replace("MethodChannel('com.angelapps.paqueteria_agentes/backups')", "MethodChannel('com.angelapps.agente_polilla/backups')")
          s=s.replace('Descargas/AlasCargoAgentes','Descargas/AgentePolilla')
          s=s.replace('Alas Cargo Agentes','Agente Polilla')
          p.write_text(s)

          for name in ('MainActivity.kt','AgentBackupStorageBridge.kt'):
              p=Path('agentes/android')/name
              s=p.read_text()
              s=s.replace('package com.angelapps.paqueteria_agentes','package com.angelapps.agente_polilla')
              s=s.replace('com.angelapps.paqueteria_agentes/backups','com.angelapps.agente_polilla/backups')
              s=s.replace('private const val FOLDER = "AlasCargoAgentes"','private const val FOLDER = "AgentePolilla"')
              s=s.replace('Alas-Cargo-Agentes-Backup.zip','Agente-Polilla-Backup.zip')
              p.write_text(s)
          PY

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.angelapps --project-name agente_polilla app
          rm -rf app/lib app/test
          cp -R agentes/lib app/lib
          cp agentes/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          cat agentes_icons/polilla.jpg.b64 | base64 --decode > app/assets/icon.png

      - name: Patch Android identity and backup bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('app/android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android.permission.CAMERA' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />')
          m = re.sub(r'android:label="[^"]+"', 'android:label="Agente Polilla"', m, count=1)
          manifest.write_text(m)

          gradle = Path('app/android/app/build.gradle.kts')
          g = gradle.read_text()
          g = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.angelapps.agente_polilla"', g, count=1)
          g = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.angelapps.agente_polilla"', g, count=1)
          g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g, count=1)
          gradle.write_text(g)
          PY
          mkdir -p app/android/app/src/main/kotlin/com/angelapps/agente_polilla
          cp agentes/android/MainActivity.kt app/android/app/src/main/kotlin/com/angelapps/agente_polilla/MainActivity.kt
          cp agentes/android/AgentBackupStorageBridge.kt app/android/app/src/main/kotlin/com/angelapps/agente_polilla/AgentBackupStorageBridge.kt

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK with increasing versionCode
        working-directory: app
        shell: bash
        run: |
          BUILD_NUMBER=$((6000 + GITHUB_RUN_NUMBER))
          echo "POLILLA_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build apk --release --build-number "$BUILD_NUMBER"

      - name: Apply persistent APK signature
        working-directory: app
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          normalize_secret() {
            local name="$1"
            local raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }
          KEYSTORE_B64="$(normalize_secret PAQUETERIA_KEYSTORE_B64 "$PAQUETERIA_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')"
          STORE_PASSWORD="$(normalize_secret PAQUETERIA_KEYSTORE_PASSWORD "$PAQUETERIA_KEYSTORE_PASSWORD")"
          KEY_ALIAS="$(normalize_secret PAQUETERIA_KEY_ALIAS "$PAQUETERIA_KEY_ALIAS")"
          KEY_PASSWORD="$(normalize_secret PAQUETERIA_KEY_PASSWORD "$PAQUETERIA_KEY_PASSWORD")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/agente-polilla-release.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks android/app/agente-polilla-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out build/app/outputs/flutter-apk/app-release-stable.apk \
            build/app/outputs/flutter-apk/app-release.apk
          mv build/app/outputs/flutter-apk/app-release-stable.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          rm -f android/app/agente-polilla-release.jks

      - name: Record build identity
        working-directory: app
        shell: bash
        run: |
          {
            echo "applicationId=com.angelapps.agente_polilla"
            echo "buildNumber=$POLILLA_BUILD_NUMBER"
            echo "signing=persistent"
            echo "independentFrom=com.angelapps.paqueteria_agentes"
            echo "logo=moth"
          } > build/app/outputs/flutter-apk/BUILD_IDENTITY.txt

      - name: Name APK from app version
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' agentes/pubspec.yaml | cut -d+ -f1)"
          APK="Agente-Polilla-v${VERSION}.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agente-Polilla-v${{ steps.version.outputs.version }}-APK
          path: |
            ${{ steps.version.outputs.apk }}
            app/build/app/outputs/flutter-apk/BUILD_IDENTITY.txt
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        shell: bash
        run: |
          TAG="agente-polilla-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Agente Polilla $VERSION" --notes "Agente Polilla con importación de clientes desde contactos, correo en clientes, pedidos sin cliente con asociación posterior y varias fotos por pedido. Mantiene package ID propio y salvas separadas."
          fi
