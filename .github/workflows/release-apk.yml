name: Build and publish Paqueteria APK

on:
  push:
    branches: ["main"]
    paths:
      - "paqueteria/**"
      - ".github/patch_paqueteria.py"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.angelapps --project-name paqueteria app
          rm -rf app/lib app/test
          cp -R paqueteria/lib app/lib
          cp paqueteria/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          rsvg-convert -w 1024 -h 1024 paqueteria/assets/icon.svg -o app/assets/icon.png

      - name: Patch source and Android
        run: python3 .github/patch_paqueteria.py

      - name: Configure stable signing
        working-directory: app
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$PAQUETERIA_KEYSTORE_B64" ]; then
            printf '%s' "$PAQUETERIA_KEYSTORE_B64" | base64 --decode > android/app/paqueteria-release.jks
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.angelapps.paqueteria"',
              s,
              count=1,
          )
          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.angelapps.paqueteria"',
              s,
              count=1,
          )

          alias = os.environ.get('PAQUETERIA_KEY_ALIAS', '').strip()
          store_password = os.environ.get('PAQUETERIA_KEYSTORE_PASSWORD', '').strip()
          key_password = os.environ.get('PAQUETERIA_KEY_PASSWORD', '').strip()
          keystore = Path('android/app/paqueteria-release.jks')

          if keystore.exists() and alias and store_password and key_password:
              def esc(value):
                  return value.replace('\\', '\\\\').replace('"', '\\"')

              signing = '''    signingConfigs {
                  create("paqueteriaRelease") {
                      keyAlias = "''' + esc(alias) + '''"
                      keyPassword = "''' + esc(key_password) + '''"
                      storeFile = file("paqueteria-release.jks")
                      storePassword = "''' + esc(store_password) + '''"
                  }
              }

          '''
              if 'create("paqueteriaRelease")' not in s:
                  s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
              s = re.sub(
                  r'(getByName\("release"\)\s*\{)(.*?)(\n\s*\})',
                  lambda m: (
                      m.group(1)
                      + m.group(2)
                      + '\n            signingConfig = signingConfigs.getByName("paqueteriaRelease")'
                      + m.group(3)
                  ),
                  s,
                  count=1,
                  flags=re.S,
              )

          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Name APK from app version
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' paqueteria/pubspec.yaml | cut -d+ -f1)"
          APK="Paqueteria-v${VERSION}.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paqueteria-v${{ steps.version.outputs.version }}-APK
          path: ${{ steps.version.outputs.apk }}
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Paqueteria $TAG" --notes "APK compilada automaticamente desde el codigo fuente del repositorio."
          fi
