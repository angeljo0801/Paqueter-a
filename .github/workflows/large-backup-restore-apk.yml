name: Build Paqueteria Large Backup Restore APK

on:
  push:
    branches: ["main"]
    paths:
      - "paqueteria/**"
      - ".github/patch_paqueteria.py"
      - ".github/patch_order_numbers.py"
      - ".github/patch_large_backup_restore.py"
      - ".github/workflows/large-backup-restore-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify signing secrets
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$PAQUETERIA_KEYSTORE_B64"
          test -n "$PAQUETERIA_KEYSTORE_PASSWORD"
          test -n "$PAQUETERIA_KEY_ALIAS"
          test -n "$PAQUETERIA_KEY_PASSWORD"

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.angelapps --project-name paqueteria app
          rm -rf app/lib app/test
          cp -R paqueteria/lib app/lib
          cp paqueteria/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          rsvg-convert -w 1024 -h 1024 paqueteria/assets/icon.svg -o app/assets/icon.png

      - name: Apply Paqueteria patches
        run: |
          python3 .github/patch_paqueteria.py
          python3 .github/patch_order_numbers.py
          python3 .github/patch_large_backup_restore.py

      - name: Configure stable signing
        working-directory: app
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          normalize_secret() {
            local name="$1"
            local raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }
          export PAQUETERIA_KEYSTORE_B64="$(normalize_secret PAQUETERIA_KEYSTORE_B64 "$PAQUETERIA_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')"
          export PAQUETERIA_KEYSTORE_PASSWORD="$(normalize_secret PAQUETERIA_KEYSTORE_PASSWORD "$PAQUETERIA_KEYSTORE_PASSWORD")"
          export PAQUETERIA_KEY_ALIAS="$(normalize_secret PAQUETERIA_KEY_ALIAS "$PAQUETERIA_KEY_ALIAS")"
          export PAQUETERIA_KEY_PASSWORD="$(normalize_secret PAQUETERIA_KEY_PASSWORD "$PAQUETERIA_KEY_PASSWORD")"
          printf '%s' "$PAQUETERIA_KEYSTORE_B64" | base64 --decode > android/app/paqueteria-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.angelapps.paqueteria"', s, count=1)
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.angelapps.paqueteria"', s, count=1)
          alias = os.environ['PAQUETERIA_KEY_ALIAS'].strip()
          store_password = os.environ['PAQUETERIA_KEYSTORE_PASSWORD'].strip()
          key_password = os.environ['PAQUETERIA_KEY_PASSWORD'].strip()
          def esc(v): return v.replace('\\', '\\\\').replace('"', '\\"')
          block = '''    signingConfigs {
              create("paqueteriaRelease") {
                  keyAlias = "''' + esc(alias) + '''"
                  keyPassword = "''' + esc(key_password) + '''"
                  storeFile = file("paqueteria-release.jks")
                  storePassword = "''' + esc(store_password) + '''"
              }
          }

          '''
          if 'create("paqueteriaRelease")' not in s:
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
          s = re.sub(
              r'(getByName\("release"\)\s*\{)(.*?)(\n\s*\})',
              lambda m: m.group(1) + m.group(2) + '\n            signingConfig = signingConfigs.getByName("paqueteriaRelease")' + m.group(3),
              s, count=1, flags=re.S,
          )
          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --build-number $((4000 + GITHUB_RUN_NUMBER))

      - name: Apply persistent APK signature
        working-directory: app
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          normalize_secret() {
            local name="$1"
            local raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }
          KEYSTORE_B64="$(normalize_secret PAQUETERIA_KEYSTORE_B64 "$PAQUETERIA_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')"
          STORE_PASSWORD="$(normalize_secret PAQUETERIA_KEYSTORE_PASSWORD "$PAQUETERIA_KEYSTORE_PASSWORD")"
          KEY_ALIAS="$(normalize_secret PAQUETERIA_KEY_ALIAS "$PAQUETERIA_KEY_ALIAS")"
          KEY_PASSWORD="$(normalize_secret PAQUETERIA_KEY_PASSWORD "$PAQUETERIA_KEY_PASSWORD")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/paqueteria-release.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks android/app/paqueteria-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out build/app/outputs/flutter-apk/app-release-stable.apk \
            build/app/outputs/flutter-apk/app-release.apk
          mv build/app/outputs/flutter-apk/app-release-stable.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Package build
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' paqueteria/pubspec.yaml | cut -d+ -f1)"
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk "out/Paqueteria-v${VERSION}-LargeBackupRestore.apk"
          printf 'version=%s\napplicationId=com.angelapps.paqueteria\nsigning=persistent\nfeature=streaming large backup restore\n' "$VERSION" > out/BUILD_IDENTITY.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paqueteria-LargeBackupRestore-APK
          path: out/
          retention-days: 30
