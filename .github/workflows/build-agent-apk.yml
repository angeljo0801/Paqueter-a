name: Build Alas Cargo Agentes APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'agentes_bundle/**'
      - 'agentes_overrides/**'
      - 'agentes_icons/official.jpg.b64'
      - '.github/workflows/build-agent-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify persistent signing secrets
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in PAQUETERIA_KEYSTORE_B64 PAQUETERIA_KEYSTORE_PASSWORD PAQUETERIA_KEY_ALIAS PAQUETERIA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Alas Cargo Agentes will not publish with temporary signing."
            exit 1
          fi

      - name: Expand source and apply official identity
        shell: bash
        run: |
          mkdir -p agentes
          cat agentes_bundle/part*.txt > /tmp/alas-cargo-agentes-source.b64
          base64 --decode /tmp/alas-cargo-agentes-source.b64 > /tmp/alas-cargo-agentes-source.tar.gz
          tar -xzf /tmp/alas-cargo-agentes-source.tar.gz -C agentes
          python3 agentes_overrides/apply_common.py agentes
          sed -i 's/^version:.*/version: 1.3.4+34/' agentes/pubspec.yaml
          sed -i "s/adaptive_icon_background: '#0B65D8'/adaptive_icon_background: '#FFFFFF'/" agentes/pubspec.yaml

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.angelapps --project-name paqueteria_agentes app
          rm -rf app/lib app/test
          cp -R agentes/lib app/lib
          cp agentes/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          cat agentes_icons/official.jpg.b64 | base64 --decode > app/assets/icon.png

      - name: Patch Android identity and backup bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('app/android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android.permission.CAMERA' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />')
          m = re.sub(r'android:label="[^"]+"', 'android:label="Alas Cargo Agentes"', m, count=1)
          manifest.write_text(m)

          gradle = Path('app/android/app/build.gradle.kts')
          g = gradle.read_text()
          g = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.angelapps.paqueteria_agentes"', g, count=1)
          g = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.angelapps.paqueteria_agentes"', g, count=1)
          g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g, count=1)
          if 'isMinifyEnabled = false' not in g:
              g, n = re.subn(
                  r'(release\s*\{)',
                  r'\1\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  g,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('No se pudo desactivar R8 para release')
          gradle.write_text(g)
          PY
          mkdir -p app/android/app/src/main/kotlin/com/angelapps/paqueteria_agentes
          cp agentes/android/MainActivity.kt app/android/app/src/main/kotlin/com/angelapps/paqueteria_agentes/MainActivity.kt
          cp agentes/android/AgentBackupStorageBridge.kt app/android/app/src/main/kotlin/com/angelapps/paqueteria_agentes/AgentBackupStorageBridge.kt

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK with increasing versionCode
        working-directory: app
        shell: bash
        run: |
          BUILD_NUMBER=$((5000 + GITHUB_RUN_NUMBER))
          echo "AGENTES_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build apk --release --build-number "$BUILD_NUMBER"

      - name: Apply persistent APK signature
        working-directory: app
        env:
          PAQUETERIA_KEYSTORE_B64: ${{ secrets.PAQUETERIA_KEYSTORE_B64 }}
          PAQUETERIA_KEYSTORE_PASSWORD: ${{ secrets.PAQUETERIA_KEYSTORE_PASSWORD }}
          PAQUETERIA_KEY_ALIAS: ${{ secrets.PAQUETERIA_KEY_ALIAS }}
          PAQUETERIA_KEY_PASSWORD: ${{ secrets.PAQUETERIA_KEY_PASSWORD }}
        shell: bash
        run: |
          normalize_secret() {
            local name="$1"
            local raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }
          KEYSTORE_B64="$(normalize_secret PAQUETERIA_KEYSTORE_B64 "$PAQUETERIA_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')"
          STORE_PASSWORD="$(normalize_secret PAQUETERIA_KEYSTORE_PASSWORD "$PAQUETERIA_KEYSTORE_PASSWORD")"
          KEY_ALIAS="$(normalize_secret PAQUETERIA_KEY_ALIAS "$PAQUETERIA_KEY_ALIAS")"
          KEY_PASSWORD="$(normalize_secret PAQUETERIA_KEY_PASSWORD "$PAQUETERIA_KEY_PASSWORD")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/alas-cargo-agentes-release.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks android/app/alas-cargo-agentes-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out build/app/outputs/flutter-apk/app-release-stable.apk \
            build/app/outputs/flutter-apk/app-release.apk
          mv build/app/outputs/flutter-apk/app-release-stable.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          rm -f android/app/alas-cargo-agentes-release.jks

      - name: Record build identity
        working-directory: app
        shell: bash
        run: |
          {
            echo "applicationId=com.angelapps.paqueteria_agentes"
            echo "buildNumber=$AGENTES_BUILD_NUMBER"
            echo "signing=persistent"
            echo "logo=official-agent-headset-bw"
          } > build/app/outputs/flutter-apk/BUILD_IDENTITY.txt

      - name: Name APK from app version
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' agentes/pubspec.yaml | cut -d+ -f1)"
          APK="Alas-Cargo-Agentes-v${VERSION}.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alas-Cargo-Agentes-v${{ steps.version.outputs.version }}-APK
          path: |
            ${{ steps.version.outputs.apk }}
            app/build/app/outputs/flutter-apk/BUILD_IDENTITY.txt
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        shell: bash
        run: |
          TAG="agentes-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Alas Cargo Agentes $VERSION" --notes "OCR de Paquetería portado a Agentes: mismas reglas para Amazon, SHEIN, Temu, AliExpress, Walmart, Costco, Target, Walgreens, Publix y CVS; accesos Escanear compra/Escanear pedido, extracción de total, subtotal, impuestos, envío, descuentos, número de orden y artículos. Conserva package ID y firma estable."
          fi
